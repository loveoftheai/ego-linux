<!doctype html><html><head><meta charset="utf-8"><title>Ego E2E Fixture</title></head>
<body>
<h1>Login Form</h1>
<form id="login">
  <label>Email <input id="email" name="email" type="email" placeholder="you@example.com"></label>
  <label>Password <input id="pw" name="pw" type="password"></label>
  <button id="submit" type="submit">Sign in</button>
</form>
<a id="about" href="https://example.com/about">About</a>
<div id="result" role="status"></div>
<script>
document.getElementById('login').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  document.getElementById('result').textContent = 'signed in as ' + email;
});
</script>
</body></html>
